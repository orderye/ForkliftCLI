services:
  db:
    image: postgres:15
    container_name: forklift-postgres
    environment:
      POSTGRES_DB: forklift
      POSTGRES_USER: forklift
      POSTGRES_PASSWORD: forklift
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: forklift-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: forklift-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant
    restart: unless-stopped

  backend:
    build: .
    container_name: forklift-backend
    depends_on:
      - db
      - redis
      - qdrant
    environment:
      DATABASE_URL: postgresql://forklift:forklift@db:5432/forklift
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      SECRET_KEY: super-secret-key-change-me
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data: