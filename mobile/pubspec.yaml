name: forklift_bao
description: ForkliftCLI — 智能叉车维修辅助工具
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 网络
  dio: ^5.4.0

  # 状态管理
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # 路由
  go_router: ^14.0.0

  # UI
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

  # 本地存储
  shared_preferences: ^2.2.0

  # 相机/图片
  camera: ^0.11.0
  image_picker: ^1.0.0

  # 权限
  permission_handler: ^11.0.0

  # 聊天界面
  flutter_chat_ui: ^1.6.0
  flutter_chat_types: ^3.6.0

  # 3D/AR
  model_viewer_plus: ^1.7.0
  flutter_unity_widget: ^2022.2.1

  # 工具
  intl: ^0.19.0
  json_annotation: ^4.8.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/
