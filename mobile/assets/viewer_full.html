<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ForkliftCLI Viewer (Full)</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
  #canvas { width: 100%; height: 100%; display: block; }
  #status { position: absolute; top: 8px; left: 8px; font: 12px/1.4 system-ui, sans-serif;
            color: #a0d0ff; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px;
            pointer-events: none; max-width: 80%; z-index: 10; }
  .loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #a0d0ff; font: 14px/1.5 system-ui; text-align: center; z-index: 5; }
  .loader::after { content: ''; display: block; width: 32px; height: 32px; margin: 12px auto 0;
                   border: 3px solid rgba(160,208,255,0.2); border-top-color: #a0d0ff;
                   border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">初始化中…</div>
<div class="loader" id="loader">加载中…</div>

<!--
  Three.js 已本地化到 assets/vendor/three/（见 vendor/README.md）。
  原先从 unpkg CDN 加载：叉车维修场景多在车库/仓库弱网环境，CDN 一挂整个 3D 页面白屏。
  版本锁定在 three@0.160.0，与 vendor 目录内文件一致，升级时需一并替换。

  路径是**相对本文件**的：本文件由 ViewerRenderer 以 asset:///assets/viewer_full.html
  加载，importmap 的基准目录即 asset:///assets/，所以 vendor/three/... 解析正确。
  不要改回绝对路径 —— WebView 里 file:/// 基址下 ES module 会被 CORS 拦死。
-->
<script type="importmap">
{
  "imports": {
    "three": "vendor/three/three.module.js",
    "three/addons/": "vendor/three/addons/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ===== 状态 =====
const status = document.getElementById('status');
const canvas = document.getElementById('canvas');

let scene, camera, renderer, controls;
let modelRoot = null;
let mixer = null;
let clock = new THREE.Clock();
let raycaster = new THREE.Raycaster();
let pointer = new THREE.Vector2();

// 零件索引：partId/name → Mesh[]
const partMap = new Map();
// 原始材质缓存：Mesh → Material[]
const originalMats = new Map();
// 爆炸图数据：Mesh → { originalPos, direction, distance }
const explodeData = new Map();
let explodeProgress = 0;
// 测量标注
let measureObjects = [];

function setStatus(msg) { status.textContent = msg; }
function showLoader(show) { document.getElementById('loader').style.display = show ? 'block' : 'none'; }
function sendEvent(name, data) {
  try { window.FlutterViewer?.postMessage(JSON.stringify({ event: name, data: data || {} })); } catch(e){}
}

// ===== 初始化 =====
function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1a2e);

  camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);

  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // 光照
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
  dirLight.position.set(5, 10, 5);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.set(2048, 2048);
  scene.add(dirLight);
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
  scene.add(hemi);

  // 地面
  const groundGeo = new THREE.PlaneGeometry(20, 20);
  const groundMat = new THREE.ShadowMaterial({ opacity: 0.3 });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 控制器
  controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.minDistance = 0.5;
  controls.maxDistance = 30;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 2.0;
  // 用户一旦开始拖拽就停止自动旋转，否则手势会和自动旋转互相打架
  controls.addEventListener('start', () => {
    if (controls.autoRotate) setAutoRotate(false);
  });

  // 窗口缩放
  window.addEventListener('resize', onResize);
  // 点击拾取零件：pointerdown 记录起点，pointerup 判定是"点击"还是"拖拽旋转"
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', () => { tapStart = null; });

  animate();
  setStatus('就绪');
  showLoader(false);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// 点击 vs 拖拽判定：位移 < 12px 且时长 < 600ms 才算点击。
// 早先在 pointerdown 里直接射线拾取，结果拖拽旋转的起手就被当成点击，
// 零件高亮会被误触发；onPointerEnd 长期是空实现，导致零件点击完全不可用。
const TAP_MAX_DISTANCE_PX = 12;
const TAP_MAX_DURATION_MS = 600;
let tapStart = null;

function onPointerDown(e) {
  tapStart = { x: e.clientX, y: e.clientY, t: performance.now() };
}

function onPointerUp(e) {
  if (!tapStart) return;
  const dx = e.clientX - tapStart.x;
  const dy = e.clientY - tapStart.y;
  const moved = Math.hypot(dx, dy);
  const duration = performance.now() - tapStart.t;
  tapStart = null;
  if (moved > TAP_MAX_DISTANCE_PX || duration > TAP_MAX_DURATION_MS) return;
  if (!modelRoot) return;

  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const meshes = [];
  modelRoot.traverse(obj => { if (obj.isMesh) meshes.push(obj); });
  const hits = raycaster.intersectObjects(meshes, false);
  if (hits.length === 0) return;

  const hit = hits[0];
  const key = partKeyOf(hit.object);
  sendEvent('onPartClicked', {
    partId: key,
    name: hit.object.userData?.partName || hit.object.name || key,
  });
}

// 按优先级给出可点击零件的标识：partId > partName > 自身名 > 最近的具名父节点。
// 单网格模型（如 AI 生成资产）没有 userData，必须回退到节点名，否则拾取结果
// 与后端 model_3d_parts.mesh_name 对不上，高亮必然失败。
function partKeyOf(obj) {
  if (obj.userData?.partId != null) return String(obj.userData.partId);
  if (obj.userData?.partName) return obj.userData.partName;
  if (obj.name) return obj.name;
  let cur = obj.parent;
  while (cur && cur !== modelRoot) {
    if (cur.userData?.partId != null) return String(cur.userData.partId);
    if (cur.name) return cur.name;
    cur = cur.parent;
  }
  return obj.name || 'root';
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  controls.update();
  renderer.render(scene, camera);
}

// ===== 模型加载 =====
async function loadModel(url) {
  setStatus('加载中…');
  showLoader(true);
  sendEvent('onModelLoadRequested', { url });

  // 清理旧模型
  if (modelRoot) {
    scene.remove(modelRoot);
    modelRoot = null;
    mixer = null;
    partMap.clear();
    originalMats.clear();
    explodeData.clear();
    clearHighlight();
    clearMeasure();
  }

  const loader = new GLTFLoader();
  // 当前资产 extensionsUsed 为空、未启用 KHR_draco_mesh_compression，
  // 故不挂 DRACOLoader；如未来需要，按 vendor/README.md 升级流程加入本地解码器。

  try {
    const gltf = await loader.loadAsync(url);
    modelRoot = gltf.scene;

    // 归一化尺寸（最长边缩放到 ~2m）
    normalizeScale(modelRoot);

    // 设置阴影
    modelRoot.traverse(obj => {
      if (obj.isMesh) {
        obj.castShadow = true;
        obj.receiveShadow = true;
        // 缓存原始材质
        originalMats.set(obj, obj.material);
      }
    });

    // 构建零件索引
    buildPartMap(modelRoot);

    // 动画
    if (gltf.animations && gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(modelRoot);
      mixer.clipAction(gltf.animations[0]).play();
      sendEvent('onAnimationReady', { count: gltf.animations.length, names: gltf.animations.map(a => a.name) });
    }

    // 相机自适应
    fitCameraToModel(modelRoot);

    scene.add(modelRoot);
    setStatus('已加载');
    sendEvent('onModelLoaded', {
      success: true,
      parts: partMap.size,
      animations: gltf.animations.length,
    });
    showLoader(false);
  } catch (err) {
    setStatus('加载失败: ' + (err.message || err));
    sendEvent('onError', { message: err.message || String(err), method: 'loadModel' });
    showLoader(false);
  }
}

function normalizeScale(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const largest = Math.max(size.x, size.y, size.z);
  if (largest <= 0) return;
  const scale = 2.0 / largest;
  root.scale.setScalar(scale);
  root.position.sub(center.multiplyScalar(scale));
}

function buildPartMap(root) {
  partMap.clear();
  root.traverse(obj => {
    if (!obj.isMesh) return;
    // 一个 mesh 可能挂在多个别名下，便于后端不管存的是节点名还是 mesh 名都能命中：
    //   partId → partName → 自身名 → 最近的具名父节点名
    const names = new Set();
    if (obj.userData?.partId != null) names.add(String(obj.userData.partId));
    if (obj.userData?.partName) names.add(obj.userData.partName);
    if (obj.name) names.add(obj.name);
    let cur = obj.parent;
    while (cur && cur !== root) {
      if (cur.userData?.partId != null) names.add(String(cur.userData.partId));
      if (cur.name) names.add(cur.name);
      cur = cur.parent;
    }
    names.forEach(key => {
      if (!partMap.has(key)) partMap.set(key, []);
      const arr = partMap.get(key);
      if (!arr.includes(obj)) arr.push(obj);
    });
  });
}

function fitCameraToModel(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);
  const fov = camera.fov * (Math.PI / 180);
  let dist = maxDim / (2 * Math.tan(fov / 2));
  dist *= 1.5; // padding
  camera.position.set(center.x, center.y + maxDim * 0.5, center.z + dist);
  controls.target.copy(center);
  controls.update();
}

// ===== 相机控制 =====
function setCamera(opts) {
  if (!controls) return;
  if (opts.azimuth != null) {
    // azimuth: 0 = 前，正值向右（度）
    const rad = (opts.azimuth * Math.PI) / 180;
    const dist = camera.position.distanceTo(controls.target);
    camera.position.x = controls.target.x + Math.sin(rad) * dist;
    camera.position.z = controls.target.z + Math.cos(rad) * dist;
  }
  if (opts.polarAngle != null) {
    // polarAngle: 0 = 上，90 = 水平（度）
    const rad = (opts.polarAngle * Math.PI) / 180;
    const dist = camera.position.distanceTo(controls.target);
    camera.position.y = controls.target.y + Math.cos(rad) * dist;
  }
  if (opts.targetDistance != null) {
    const dir = new THREE.Vector3().subVectors(camera.position, controls.target);
    dir.normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(opts.targetDistance));
  }
  controls.update();
  sendEvent('onCameraSet', opts);
}

function resetView() {
  if (!modelRoot) return;
  fitCameraToModel(modelRoot);
  sendEvent('onResetView', {});
}

// 自动旋转：由 Dart 侧开关控制，用户一旦拖拽就自动停，避免与手势抢相机。
function setAutoRotate(enabled, speed) {
  if (!controls) return;
  controls.autoRotate = !!enabled;
  if (speed != null) controls.autoRotateSpeed = speed;
  sendEvent('onAutoRotate', { enabled: controls.autoRotate, speed: controls.autoRotateSpeed });
}

// ===== 零件高亮 =====
function resolvePartMeshes(partId) {
  const exact = partMap.get(partId) || partMap.get(String(partId));
  if (exact && exact.length > 0) return exact;
  const fuzzy = [];
  for (const [key, arr] of partMap.entries()) {
    if (String(key).toLowerCase().includes(String(partId).toLowerCase())) fuzzy.push(...arr);
  }
  return fuzzy;
}

function highlightPart(partId, color) {
  const meshes = resolvePartMeshes(partId);
  if (!meshes || meshes.length === 0) {
    sendEvent('onError', { message: `未找到零件: ${partId}`, method: 'highlightPart' });
    return;
  }

  const c = new THREE.Color(color || '#ffeb3b');
  let applied = 0;
  meshes.forEach(mesh => {
    const orig = originalMats.get(mesh);
    if (!orig || mesh.userData._highlighted) return;
    const hl = new THREE.MeshStandardMaterial({
      color: orig.color || 0xffffff,
      emissive: c,
      emissiveIntensity: 0.6,
      transparent: true,
      opacity: 0.9,
    });
    mesh.material = hl;
    mesh.userData._highlighted = true;
    mesh.userData._highlightMat = hl;
    applied++;
  });
  sendEvent('onHighlightSet', { partId, color, count: meshes.length, applied });
  if (applied === 0) {
    sendEvent('onError', {
      message: `零件 ${partId} 无可用材质，未高亮`,
      method: 'highlightPart',
    });
  }
}

function clearHighlight() {
  // 高亮材质用完即销毁，避免每次点击都泄漏一份 GPU 资源。
  for (const [mesh, orig] of originalMats.entries()) {
    if (!mesh.userData._highlighted) continue;
    if (mesh.userData._highlightMat) {
      mesh.userData._highlightMat.dispose();
      delete mesh.userData._highlightMat;
    }
    mesh.material = orig;
    mesh.userData._highlighted = false;
  }
  sendEvent('onHighlightCleared', {});
}

// ===== 爆炸图 =====
function setExploded(progress) {
  explodeProgress = Math.max(0, Math.min(1, progress));

  if (!modelRoot) return;

  // 如果还没有爆炸数据，自动构建
  if (explodeData.size === 0) {
    // 取整个模型根节点的中心作为爆炸原点；每个零件的方向 = 零件中心 - 模型中心。
    // 先用一个临时 Box3 收集整体包围盒（注意：loadModel 里已经 normalizeScale + 居中，
    // 但 normalize 后的中心可能不是 (0,0,0)，所以必须显式计算）。
    const modelBox = new THREE.Box3().setFromObject(modelRoot);
    const modelCenter = new THREE.Vector3();
    modelBox.getCenter(modelCenter);
    const partCenter = new THREE.Vector3();
    modelRoot.traverse(obj => {
      if (!obj.isMesh) return;
      const box = new THREE.Box3().setFromObject(obj);
      box.getCenter(partCenter);
      // 方向：从模型整体中心指向零件中心；零向量则给个默认 +Z 兜底。
      const dir = partCenter.clone().sub(modelCenter);
      if (dir.lengthSq() === 0) dir.set(0, 0, 1);
      dir.normalize();
      explodeData.set(obj, {
        originalPos: obj.position.clone(),
        direction: dir,
        distance: 1.5,
      });
    });
  }

  for (const [mesh, data] of explodeData.entries()) {
    mesh.position.copy(data.originalPos).addScaledVector(data.direction, data.distance * explodeProgress);
  }

  sendEvent('onExplodedSet', { progress: explodeProgress });
}

// ===== 动画 =====
function playAnimation(name, speed) {
  if (!mixer) {
    sendEvent('onError', { message: '无动画播放能力', method: 'playAnimation' });
    return;
  }
  const action = mixer.clipAction(name);
  if (action) {
    action.reset().play();
    if (speed) action.setEffectiveTimeScale(speed);
    sendEvent('onAnimationPlayed', { name, speed });
  } else {
    sendEvent('onError', { message: `未找到动画: ${name}`, method: 'playAnimation' });
  }
}

function stopAnimation() {
  if (!mixer) return;
  mixer.stopAllAction();
  sendEvent('onAnimationStopped', {});
}

// ===== 测量标注 =====
function measure(from, to, label) {
  // 先清除
  clearMeasure();

  const fromObj = findPart(from);
  const toObj = findPart(to);
  if (!fromObj || !toObj) {
    sendEvent('onError', { message: `找不到测量目标: ${!fromObj ? 'from=' + from : 'to=' + to}`, method: 'measure' });
    return;
  }

  const fromCenter = getMeshCenter(fromObj);
  const toCenter = getMeshCenter(toObj);
  const distance = fromCenter.distanceTo(toCenter) * 1000; // mm

  // 画线
  const geo = new THREE.BufferGeometry().setFromPoints([fromCenter, toCenter]);
  const mat = new THREE.LineBasicMaterial({ color: 0x00e5ff, linewidth: 2 });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  measureObjects.push(line);

  // 距离标签（Sprite）
  const mid = new THREE.Vector3().addVectors(fromCenter, toCenter).multiplyScalar(0.5);
  const sprite = createTextSprite(`${label || ''} ${distance.toFixed(0)}mm`, 0x00e5ff);
  sprite.position.copy(mid);
  sprite.scale.set(0.5, 0.2, 1);
  scene.add(sprite);
  measureObjects.push(sprite);

  sendEvent('onMeasureSet', { from, to, distanceMm: distance, label });
}

function clearMeasure() {
  measureObjects.forEach(obj => {
    scene.remove(obj);
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose();
  });
  measureObjects = [];
  sendEvent('onMeasureCleared', {});
}

function findPart(id) {
  const meshes = resolvePartMeshes(id);
  return meshes && meshes.length > 0 ? meshes[0] : null;
}

function getMeshCenter(mesh) {
  const box = new THREE.Box3().setFromObject(mesh);
  return box.getCenter(new THREE.Vector3());
}

function createTextSprite(text, color) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 24px sans-serif';
  const metrics = ctx.measureText(text);
  canvas.width = metrics.width + 20;
  canvas.height = 40;
  ctx.font = 'bold 24px sans-serif';
  ctx.fillStyle = `#${color.toString(16).padStart(6, '0')}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: texture, transparent: true });
  return new THREE.Sprite(mat);
}

// ===== AR（WebXR） =====
async function enterAR() {
  if (!navigator.xr) {
    sendEvent('onError', { message: '浏览器不支持 WebXR', method: 'enterAR' });
    return;
  }
  try {
    const supported = await navigator.xr.isSessionSupported('immersive-ar');
    if (!supported) {
      sendEvent('onError', { message: '设备不支持 AR', method: 'enterAR' });
      return;
    }
    // WebXR AR 模式
    renderer.xr.enabled = true;
    const session = await navigator.xr.requestSession('immersive-ar', {
      optionalFeatures: ['local-floor', 'hit-test']
    });
    renderer.xr.setSession(session);
    sendEvent('onARActivated', {});
  } catch (e) {
    sendEvent('onError', { message: e.message || String(e), method: 'enterAR' });
  }
}

function exitAR() {
  if (renderer?.xr?.session) {
    renderer.xr.session.end();
  }
  renderer.xr.enabled = false;
  sendEvent('onARExitRequested', {});
}

// ===== 桥协议 =====
// Dart 发送：window.flutterBridge.callMethod(method, paramsObject)
// 每个函数内部直接接收 params 对象。
const bridge = {
  loadModel: (p) => loadModel(p.url),
  setCamera: (p) => setCamera(p),
  resetView: (p) => resetView(),
  setAutoRotate: (p) => setAutoRotate(p.enabled, p.speed),
  enterAR: (p) => enterAR(),
  exitAR: (p) => exitAR(),
  highlightPart: (p) => highlightPart(p.partId, p.color),
  clearHighlight: (p) => clearHighlight(),
  setExploded: (p) => setExploded(p.progress),
  playAnimation: (p) => playAnimation(p.name, p.speed),
  stopAnimation: (p) => stopAnimation(),
  measure: (p) => measure(p.from, p.to, p.label),
  clearMeasure: (p) => clearMeasure(),
};

window.flutterBridge = {
  callMethod: (method, params) => {
    try {
      const fn = bridge[method];
      if (typeof fn !== 'function') {
        return { ok: false, error: 'Unknown method: ' + method };
      }
      fn(params || {});
      return { ok: true, method };
    } catch (e) {
      return { ok: false, error: String(e) };
    }
  }
};

// 启动
init();
// 通知 Dart 渲染器已就绪：解除 ViewerController.invoke 里的 await。
// 必须在 init() 之后发送，此时 WebGL 上下文、OrbitControls、地面、灯光都已就位，
// 第一条 Dart→JS 命令可以安全执行。
sendEvent('onViewerReady', {});
</script>
</body>
</html>
